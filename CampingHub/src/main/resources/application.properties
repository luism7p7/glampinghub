spring.application.name=CampingHub

# Puerto: Render lo entrega en la variable PORT
server.port=${PORT:8080}
server.compression.enabled=true

# --- Base de datos ---
# En producción se configura con variables de entorno (nunca se guardan contraseñas en el repositorio):
#   DB_URL=jdbc:mysql://<host>:<puerto>/defaultdb?sslMode=REQUIRED
#   DB_USERNAME=...   DB_PASSWORD=...
# Sin variables, arranca con una base H2 en memoria para probar en local.
spring.datasource.url=${DB_URL:jdbc:h2:mem:campinghub;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# --- JPA / Hibernate ---
# 'update' crea y actualiza las tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Clave para el CRUD interno (usuarios, clientes, administradores). Vacía = desactivado.
app.admin-key=${ADMIN_KEY:}
