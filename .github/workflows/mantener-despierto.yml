name: mantener-despierto

# Respaldo: la app ya se mantiene despierta sola (MantenerDespierto.java visita su propia
# dirección cada 10 minutos y consulta la base de datos). Este flujo la despierta si alguna
# vez se durmió o se reinició. GitHub puede retrasar las ejecuciones programadas.
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Despertar la app y la base de datos
        run: |
          # Un arranque en frío del plan gratuito tarda 1 o 2 minutos: se espera hasta 4.
          curl -sS -o /dev/null -w "salud: %{http_code} en %{time_total}s\n" --max-time 240 https://glampinghub-mzyu.onrender.com/salud || true
          curl -fsS -o /dev/null -w "fincas: %{http_code} en %{time_total}s\n" --retry 2 --retry-delay 15 --max-time 90 https://glampinghub-mzyu.onrender.com/fincas
